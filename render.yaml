services:
  - type: web
    name: global-data-governance-tracker
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: MONITOR_HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data
      - key: REQUIRE_LOGIN
        value: "0"
      - key: ALLOW_REGISTRATION
        value: "0"
      - key: COOKIE_SECURE
        value: "1"
      - key: ENABLE_SCHEDULER
        value: "1"
      - key: UPDATE_INTERVAL_SECONDS
        value: "21600"
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: DEEPSEEK_API_KEY
        sync: false
    disk:
      name: tracker-data
      mountPath: /var/data
      sizeGB: 2
